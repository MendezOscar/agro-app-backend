services:
  minio:
    image: minio/minio:latest
    container_name: agroapp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agroapp
      MINIO_ROOT_PASSWORD: agroapp_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 agroapp agroapp_dev;
      mc mb --ignore-existing local/agroapp-images;
      mc anonymous set download local/agroapp-images;
      exit 0;
      "

volumes:
  minio_data:
